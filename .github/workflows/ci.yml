name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Tests and vet
        run: go test ./... && go vet ./... && go vet -tags vmintegration ./... && go test -race ./...
      - name: Build
        run: go build ./...
      - name: Both architectures compile, with every build tag
        # The vm driver makes system calls by number and the syscall
        # package does not name the same ones everywhere: code written
        # on one architecture has failed to compile on the other.
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build ./...
            GOOS=linux GOARCH=$arch go vet ./...
            GOOS=linux GOARCH=$arch go vet -tags integration ./...
            GOOS=linux GOARCH=$arch go vet -tags vmintegration ./...
          done
      - name: Isolated Docker and Linux network acceptance
        run: |
          CGO_ENABLED=0 go test -c -tags integration -o "$RUNNER_TEMP/sandbox-integration.test" .
          sudo "$RUNNER_TEMP/sandbox-integration.test" -test.v
