name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Tests and vet
        run: go test ./... && go vet ./... && go test -race ./...
      - name: Build
        run: go build ./...
      - name: Isolated Docker and Linux network acceptance
        run: |
          CGO_ENABLED=0 go test -c -tags integration -o "$RUNNER_TEMP/sandbox-integration.test" .
          sudo "$RUNNER_TEMP/sandbox-integration.test" -test.v
